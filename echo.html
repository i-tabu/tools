<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<!-- site-version:start -->
<script>
(() => {
  if (!/^https?:$/.test(location.protocol)) return;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4000);
  const manifest = new URL("site-version.json", location.href);
  manifest.searchParams.set('_', Date.now());
  fetch(manifest, { cache: 'no-store', signal: controller.signal })
    .then(response => { if (!response.ok) throw new Error('Version unavailable'); return response.json(); })
    .then(({ version }) => {
      if (!/^[a-f0-9]{16}$/.test(version) || version === '635d3d31ad5a55c9') return;
      const url = new URL(location.href);
      if (url.searchParams.get('v') === version) return;
      url.searchParams.set('v', version);
      location.replace(url.href);
    })
    .catch(() => {})
    .finally(() => clearTimeout(timeout));
})();
</script>
<!-- site-version:end -->
  <title>Mic Echo App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f8f9fa;
    }
    #toggleBtn {
    	font-size:40px;
        text-transform: uppercase;
        width:50%;
        height:20%;
        font-weight:bold;
    }
  </style>
</head>
<body>
  <button id="toggleBtn" class="btn btn-primary btn-lg">Echo</button>

  <script>
    let audioContext;
    let micStream;
    let source;
    let isPlaying = false;

    const button = document.getElementById('toggleBtn');

    button.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          source = audioContext.createMediaStreamSource(micStream);
          source.connect(audioContext.destination); // Echo to output
          isPlaying = true;
          button.textContent = "Stop";
          button.classList.remove("btn-primary");
          button.classList.add("btn-danger");
        } catch (err) {
          console.error("Error accessing microphone", err);
        }
      } else {
        source.disconnect();
        micStream.getTracks().forEach(track => track.stop());
        audioContext.close();
        isPlaying = false;
        button.textContent = "Echo";
        button.classList.remove("btn-danger");
        button.classList.add("btn-primary");
      }
    });
  </script>
</body>
