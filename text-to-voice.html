<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<!-- site-version:start -->
<script>
(() => {
  if (!/^https?:$/.test(location.protocol)) return;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4000);
  const manifest = new URL("site-version.json", location.href);
  manifest.searchParams.set('_', Date.now());
  fetch(manifest, { cache: 'no-store', signal: controller.signal })
    .then(response => { if (!response.ok) throw new Error('Version unavailable'); return response.json(); })
    .then(({ version }) => {
      if (!/^[a-f0-9]{16}$/.test(version) || version === '635d3d31ad5a55c9') return;
      const url = new URL(location.href);
      if (url.searchParams.get('v') === version) return;
      url.searchParams.set('v', version);
      location.replace(url.href);
    })
    .catch(() => {})
    .finally(() => clearTimeout(timeout));
})();
</script>
<!-- site-version:end -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text to Speech App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      padding: 40px;
    }
    .app-container {
      /*max-width: 700px;*/
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    textarea {
      resize: none;
    }
    .btn-group {
      display: flex;
      justify-content: end;
      gap: 10px;
    }
    #textInput {
      font-size:2.2rem;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h5 class="mb-2 text-center">Text to Speech</h5>

    <div class="mb-3">
      <textarea id="textInput" autofocus class="form-control" rows="6" placeholder="Type something here... (Press Enter to Speak, Shift+Enter for newline)"></textarea>
    </div>

    <div class="btn-group mb-3">
      <button class="btn btn-secondary" onclick="clearText()">Clear</button>
      <button class="btn btn-primary" onclick="speakText()">Speak</button>
    </div>
    
    <div class="">
      <label for="voiceSelect" class="form-label">Select Voice</label>
      <select id="voiceSelect" class="form-select"></select>
    </div>

  </div>

  <script>
    const voiceSelect = document.getElementById("voiceSelect");
    let voices = [];

    function populateVoices() {
      voices = speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';

      let defaultVoiceIndex = 0;

      voices.forEach((voice, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})${voice.default ? " — Default" : ""}`;
        voiceSelect.appendChild(option);
        // Set "Google हिन्दी" as default if available
        if (voice.lang == 'hi-IN') {
          voiceSelect.selectedIndex = index;
        }
      });      
    }

    speechSynthesis.onvoiceschanged = populateVoices;

    function speakText() {
      const text = document.getElementById("textInput").value;
      if (text.trim() !== "") {
        const utterance = new SpeechSynthesisUtterance(text);
        const selectedVoice = voices[voiceSelect.value];
        if (selectedVoice) utterance.voice = selectedVoice;

        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
      }
    }

    function clearText() {
      document.getElementById("textInput").value = "";
    }

    document.getElementById("textInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        speakText();
      }
      if (e.key === "Escape") {
        e.preventDefault();
        clearText();
      }
    });

    // Trigger voices loading (needed for some browsers)
    window.speechSynthesis.getVoices();
  </script>
</body>
